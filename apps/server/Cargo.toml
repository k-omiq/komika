[package]
name = "komika-server"
version = "0.1.0"
edition = "2021"
description = "Komika unified GraphQL API — federates Suwayomi + Komika-native social/auth/discovery."
license = "MIT"

[[bin]]
name = "komika-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "0.8", features = ["multipart"] }
async-graphql = "7"
async-graphql-axum = "7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header", "catch-panic", "request-id"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Cover perceptual-hash (dedup signal, CATALOGUE.md §4) + user avatar processing
# (apps/server/src/avatar.rs): decode JPEG/PNG/WebP uploads and re-encode avatars
# as lossless WebP (pure-Rust — no libwebp/C dependency). Only the codecs we use,
# to keep the dependency surface + binary small.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# `unwind` (not `abort`) so the tower_http CatchPanic layer can turn a panicking
# resolver into a 500 instead of taking down the whole worker process.
panic = "unwind"
