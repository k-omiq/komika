# Komika — full self-hosted public stack ("Mihon/Tachiyomi, but hosted, with a
# public social layer and an auto-updating catalog").
#
# One-command bring-up:   cd deploy && ./deploy.sh
# (or manually:           docker compose up --build -d  &&  ./bootstrap.sh )
#
# Services:
#   suwayomi     — Tachidesk/Suwayomi: runs the source extensions (catalog,
#                  chapters, page images). Bootstrapped with MangaDex + repos.
#   flaresolverr — Cloudflare-challenge solver; Suwayomi routes protected sources
#                  through it (enabled by bootstrap.sh). Internal-only.
#   server       — komika-server (axum + async-graphql + SQLite): federates
#                  suwayomi, adds accounts + social + admin, and runs the adaptive
#                  scan scheduler that keeps the library auto-updated.
#   reader       — static SvelteKit SPA (nginx), pointed at the server.
#
# Public wiring: GraphQL federation stays on the internal network
# (SUWAYOMI_URL=http://suwayomi:4567). Suwayomi's port is bound to loopback only
# (its admin API is unauthenticated), so browser images route through the
# Cloudflare image Worker (reader IMG_MODE=proxy; set KOMIKA_IMG_WORKER_URL).
# Set PUBLIC_HOST to your domain/IP in deploy/.env for a real deploy.

name: komika

services:
  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:stable
    restart: unless-stopped
    environment:
      TACHIDESK_SERVER_IP: 0.0.0.0
      TACHIDESK_SERVER_PORT: '4567'
    volumes:
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    ports:
      # Bound to LOOPBACK only: Suwayomi's GraphQL admin API is unauthenticated
      # (add/remove sources, trigger downloads, enumerate library), so it must not
      # be internet-reachable. The server federates it over the internal network
      # (SUWAYOMI_URL=http://suwayomi:4567), which is unaffected. Browser images go
      # through the Cloudflare image Worker (reader IMG_MODE=proxy below), not this
      # port. Suwayomi-source (non-canonical) images ARE reachable: the server
      # proxies their cover/page bytes at `/api/v1/manga/...` (SUWAYOMI_PUBLIC_URL
      # points at the server), so covers load from the API origin and pages ride the
      # image Worker — alongside the canonical MangaDex path (uploads.mangadex.org /
      # mangadex.network).
      - '127.0.0.1:${SUWAYOMI_PORT:-4567}:4567'
    networks: [komika]
    healthcheck:
      # Suwayomi's image ships curl (no wget), so probe with curl.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4567/ >/dev/null 2>&1 || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}
    # Internal-only: Suwayomi reaches it at http://flaresolverr:8191.
    networks: [komika]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8191/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      PORT: '8080'
      DATABASE_URL: sqlite:///data/komika.sqlite3
      # User avatars are stored as BLOBs in the SQLite DB, so they are
      # Litestream-replicated with it and any replica can serve any avatar.
      SUWAYOMI_URL: http://suwayomi:4567
      # Public base for the Suwayomi cover/page image URLs handed to the browser.
      # These point at THIS server, which proxies `/api/v1/manga/{id}/thumbnail` and
      # `/api/v1/manga/{id}/chapter/{ci}/page/{pi}` from the loopback-only Suwayomi
      # (:4567 is never internet-reachable). Defaults to the server's own public
      # origin; for the tunneled prod deploy set SUWAYOMI_PUBLIC_URL=https://api.komiq.cc
      # in deploy/.env. Covers then load straight from this origin, and page images
      # ride the Cloudflare image Worker (which allowlists this host).
      SUWAYOMI_PUBLIC_URL: ${SUWAYOMI_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:${SERVER_PORT:-8080}}
      # Public reader origin(s) allowed to call the API. Honors CORS_ORIGINS from
      # deploy/.env (e.g. https://komiq.cc); falls back to the local reader port.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://${PUBLIC_HOST:-localhost}:${READER_PORT:-8081}}
      # CIDRs of trusted reverse proxies. Leave blank when publishing 8080
      # directly (the default) so the auth rate-limiter keys on the real socket
      # peer. Set it (e.g. 10.0.0.0/8) ONLY if a proxy you control fronts the
      # server and sets X-Forwarded-For / X-Real-IP.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      KOMIKA_ADMIN_USERS: ${KOMIKA_ADMIN_USERS:-admin}
      # The server provisions the admin account(s) at startup: a configured admin
      # username is reserved from open registration and created from this password
      # (or promoted if it already exists). Required to create a fresh admin.
      KOMIKA_ADMIN_PASSWORD: ${KOMIKA_ADMIN_PASSWORD:-}
      KOMIKA_ADMIN_EMAIL: ${KOMIKA_ADMIN_EMAIL:-admin@example.com}
      # GraphiQL IDE + schema introspection. Off by default so the public API
      # exposes neither; set GRAPHIQL_ENABLED=on in deploy/.env only for dev.
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-off}
      SCAN_TICK_SECONDS: ${SCAN_TICK_SECONDS:-300}
      # Canonical catalogue sync (direct MangaDex; CATALOGUE.md). Off by default —
      # nothing hits MangaDex unless CATALOGUE_SYNC=on. It is opt-in and, because
      # the rate limiter is in-process, only ONE replica may enable it (see
      # CATALOGUE.md "Single-replica constraint (M4)"). Set a descriptive
      # MANGADEX_USER_AGENT when enabling, per MangaDex API etiquette. COVER_PHASH
      # adds cover perceptual-hashing for dedup on top of the sync.
      CATALOGUE_SYNC: ${CATALOGUE_SYNC:-off}
      MANGADEX_USER_AGENT: ${MANGADEX_USER_AGENT:-Komika/0.1 (+https://github.com/komika)}
      CATALOGUE_SYNC_INTERVAL_SECS: ${CATALOGUE_SYNC_INTERVAL_SECS:-21600}
      COVER_PHASH: ${COVER_PHASH:-off}
      RUST_LOG: komika_server=info,tower_http=warn
      # Continuous backup (Litestream → S3-compatible; Cloudflare R2 reference).
      # Blank = run without backup. For R2 set LITESTREAM_REGION=auto.
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-auto}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - server-data:/data
    ports:
      - '${SERVER_PORT:-8080}:8080'
    depends_on:
      suwayomi:
        condition: service_healthy
    networks: [komika]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health || exit 1']
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s

  reader:
    build:
      context: ..
      dockerfile: deploy/reader.Dockerfile
      args:
        PUBLIC_KOMIKA_BACKEND: 'on'
        PUBLIC_KOMIKA_BACKEND_KIND: komika
        PUBLIC_KOMIKA_API: http://${PUBLIC_HOST:-localhost}:${SERVER_PORT:-8080}/graphql
        # Images route through the Cloudflare image Worker (not the now
        # loopback-only Suwayomi port). Set KOMIKA_IMG_WORKER_URL in deploy/.env
        # to your deployed Worker's base URL; images stay broken until it is set.
        PUBLIC_KOMIKA_IMG_MODE: proxy
        PUBLIC_KOMIKA_IMG_WORKER: ${KOMIKA_IMG_WORKER_URL:-}
    restart: unless-stopped
    environment:
      # CSP origins (nginx templates them at boot). Image mode is `proxy`, so
      # images load from the image Worker; connect-src is the GraphQL API origin.
      CSP_IMG_ORIGIN: ${KOMIKA_IMG_WORKER_URL:-}
      CSP_CONNECT_ORIGIN: http://${PUBLIC_HOST:-localhost}:${SERVER_PORT:-8080}
    ports:
      - '${READER_PORT:-8081}:80'
    depends_on: [server]
    networks: [komika]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  komika:
    driver: bridge

volumes:
  suwayomi-data:
  server-data:
