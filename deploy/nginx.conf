# nginx config for the reader SPA (adapter-static fallback: index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defence-in-depth; the reader is a static SPA).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tune CSP once the exact backend/image origins are fixed; keep it strict.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self' https:" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite-hashed assets are content-addressed -> cache forever.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: serve index.html for any unmatched route so
    # client-side routing (/browse, /series/<slug>, /read/<slug>) resolves.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
