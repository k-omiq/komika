// Komika unified backend — GraphQL contract (SDL).
//
// This is the schema the client in `@komika/api` codes against. The Komika server
// implements it by FEDERATING two concerns:
//   • Catalog / chapters / pages / library / progress  → sourced from a
//     Suwayomi/Tachidesk-style server (the operator curates enabled sources;
//     the catalog is auto-served, so there is NO user-facing source picking).
//   • Social / auth / discovery / adaptive-scan         → Komika's own services.
//
// Fields annotated "[suwayomi]" are proxied/derived from Suwayomi's GraphQL
// (e.g. MangaType.title/thumbnailUrl/genre/status/inLibrary, ChapterType.*,
// fetchChapterPages). Fields annotated "[komika]" are Komika-native.

schema {
	query: Query
	mutation: Mutation
}

type Query {
	# catalog
	discovery: [DiscoveryFeed!]! # [komika] curated feeds over the [suwayomi] catalog
	updates(page: Int = 1): SeriesPage! # [komika] library series the adaptive scanner found new chapters for, newest-first
	search(query: String!, page: Int = 1, genres: [String!], minRating: Float, maxRating: Float): SeriesPage! # [komika] S4: catalogue search. Empty query browses the persisted catalogue from the DB (filterable); text query does a live source search. `genres` matches ANY (case-insensitive); `minRating`/`maxRating` filter by aggregate user rating 0–10 (minRating>0 drops unrated)
	genreFacets: [GenreFacet!]! # [komika] S4: available genre/tag facets across the persisted catalogue (most common first) — drives the search UI's genre filter
	searchAllSources(query: String!, page: Int = 1): FederatedSearchPage! # [komika] federated multi-extension search — fans out to every installed source, dedupes to one canonical work per series with its per-source translators; NSFW-gated by the viewer's posture. REQUIRES LOGIN (persists mappings); per-user rate-limited (~20/min); errors "Not authenticated" for anonymous callers
	series(id: ID!): Series! # [suwayomi] MangaType by id
	chapters(seriesId: ID!): [Chapter!]! # [suwayomi] chapters(condition:{mangaId}) — one source's chapter list (served from the DB cache, S1)
	aggregatedChapters(workId: ID!): [AggregatedChapter!]! # [komika] S2: a canonical work's chapters aggregated across ALL sources (installed Suwayomi sources + MangaDex mirror), deduped by number, each carrying per-source availability so the reader can pick a translator
	pages(chapterId: ID!): [Page!]! # [suwayomi] fetchChapterPages -> normalized pages
	canonicalUpdates(page: Int = 1): [CanonicalUpdate!]! # [komika] MangaDex mirror updates, newest chapter first, NSFW-filtered (data feed)
	# Canonical (MangaDex-mirrored) reader path — workId is the `w_`-prefixed canonical
	# id (distinct from numeric Suwayomi ids), so the reader routes it here. Returns the
	# shared Series/Chapter/Page shapes; NSFW-gated by the viewer's preference. CATALOGUE.md §6.
	canonicalSeries(workId: ID!): Series! # [komika] a MangaDex-mirrored work as a Series
	canonicalChapters(workId: ID!): [Chapter!]! # [komika] its chapters from the mirror, deduped/ordered
	canonicalPages(chapterId: ID!): [Page!]! # [komika] page URLs via MangaDex@Home (chapterId = MangaDex chapter uuid)
	# native-embedded-Suwayomi source routing — per canonical work, the source
	# mappings + extension coordinates a native client needs to fetch it directly.
	workSources(workId: ID!): [WorkSource!]! # [komika] source mappings for one canonical work
	workSourcesBatch(workIds: [ID!]!): [WorkSourceGroup!]! # [komika] source mappings grouped per work
	# library
	library: [Series!]! # [suwayomi] mangas(condition:{inLibrary:true})
	libraryProgress: [SeriesProgress!]! # [komika] per-series read/total for every in-library series, batched — shelves the Library/Profile screens without an N+1 chapters() fan-out
	# social
	reviews(seriesId: ID!, page: Int = 1): ReviewPage! # [komika]
	myReview(seriesId: ID!): Review # [komika] the signed-in viewer's own review for a series, regardless of pagination (null if none / signed out)
	comments(targetType: String!, targetId: ID!, page: Int = 1): CommentPage! # [komika] chapter thread or series discussion
	# auth
	session: Session # [komika] current session or null
	myActivity(limit: Int = 20): [Activity!]! # [komika] the signed-in user's recent activity feed (empty when signed out)
	notifications(page: Int = 1): [Notification!]! # [komika] the viewer's inbound bell feed, newest-first (empty when signed out)
	unreadNotificationCount: Int! # [komika] unread count for the bell badge (0 when signed out)
	# ops / admin (all require isAdmin)
	scanStatus: ScanStatus! # [komika] adaptive scan-scheduler health (admin console)
	users(page: Int = 1): AdminUserPage! # [komika] admin user-management list
	mergeQueue: [MergeCandidate!]! # [komika] dedup review queue — pending mid-confidence matches (requires isAdmin)
	extensions(installedOnly: Boolean = false, lang: String, nsfw: Boolean, refresh: Boolean = false): [ExtensionInfo!]! # [komika] Keiyoushi/Mihon extensions known to the engine; first use seeds the Keiyoushi store; refresh re-fetches the store indexes; NSFW hidden unless opted in (requires isAdmin)
	sources: [SourceInfo!]! # [komika] installed Suwayomi sources — the sourceBrowse picker; NSFW hidden unless opted in (requires isAdmin)
	sourceBrowse(sourceId: ID!, type: SourceBrowseType!, page: Int = 1, query: String): SourceBrowsePage! # [komika] browse/search one source's catalogue for bulk ingest (requires isAdmin)
	seriesSourcesBatch(seriesIds: [ID!]!): [SeriesSourceGroup!]! # [komika] catalogue provenance per Suwayomi series — linked work + source mappings, input order, ≤200 ids (requires isAdmin)
	sourceIngestJobs(active: Boolean = false): [SourceIngestJob!]! # [komika] "add all from source" ingest jobs, newest first; active:true for only running ones — poll for progress (requires isAdmin)
	seriesAdminMeta(seriesId: ID!): SeriesAdminMeta! # [komika] raw metadata-override state of a series' canonical work (pinned title/description/type/NSFW + curated tags) for the series-detail editor (requires isAdmin)
	workChaptersAdmin(workId: ID!): [AdminChapter!]! # [komika] a work's aggregated chapters WITH override state (hidden/renamed), unfiltered, for the series-detail editor (requires isAdmin)
}

type Mutation {
	mark(seriesId: ID!, marked: Boolean!): Series! # [suwayomi] updateManga inLibrary (+ [komika] scan priority)
	setLibraryStatus(seriesId: ID!, status: String): Series! # [komika] file a series under an explicit shelf (reading|completed|onhold|plan); null clears to auto-derive; adds to library if absent
	setFavorite(seriesId: ID!, favorite: Boolean!): Series! # [komika] toggle the viewer's favourite flag; adds to library if absent
	setProgress(chapterId: ID!, lastPageRead: Int!, read: Boolean!): Boolean! # [suwayomi] updateChapter
	recordView(seriesId: ID!): Boolean! # [komika] record one view (chapter open) — no auth, counts everyone; the popularity signal behind Trending
	postReview(input: PostReviewInput!): Review! # [komika]
	postComment(input: PostCommentInput!): Comment! # [komika] chapter thread or series discussion
	voteComment(commentId: ID!, value: Int!): CommentVote! # [komika] like (1) / dislike (-1) / clear (0) a comment
	markNotificationsRead(ids: [ID!]): Int! # [komika] mark given (or all, if omitted) notifications read; returns count changed
	login(username: String!, password: String!): Session! # [komika]
	register(input: RegisterInput!): Session! # [komika]
	logout: Boolean! # [komika]
	setShowNsfw(value: Boolean!): Boolean! # [komika] set the viewer's NSFW visibility preference (CATALOGUE.md §2)
	updateProfile(input: UpdateProfileInput!): SessionUser! # [komika] update the viewer's display name + bio (avatar upload is REST: POST /avatar)
	updateSeriesAdmin(input: SeriesAdminInput!): Series! # [komika] admin "manga DB" overrides (requires isAdmin)
	triggerScan(seriesId: ID!): Series! # [komika] admin — force an immediate re-scan (requires isAdmin)
	banUser(userId: ID!, banned: Boolean!): AdminUser! # [komika] admin moderation — suspend/restore an account (requires isAdmin)
	deleteComment(commentId: ID!): Boolean! # [komika] admin moderation — remove a chapter comment (requires isAdmin)
	setUserAdmin(userId: ID!, isAdmin: Boolean!): AdminUser! # [komika] admin — grant/revoke admin (requires isAdmin)
	addSourceSeries(suwayomiMangaId: ID!): MatchResult! # [komika] Tier-2 add flow — run the dedup matcher, wire into the canonical model (requires isAdmin)
	resolveMergeCandidate(id: ID!, accept: Boolean!): Boolean! # [komika] resolve a dedup review — accept merges, reject keeps distinct (requires isAdmin)
	mergeWorks(sourceWorkId: ID!, targetWorkId: ID!): MergeWorksResult! # [komika] D1: fold one existing canonical work into another (dedup cleanup) — source's mappings + user data re-point to target, source deleted; pick target as the enriched/MangaDex-anchored one (requires isAdmin)
	addExtensionRepo(indexUrl: String!): Int! # [komika] register an extension repo (store) + refresh; returns the extension count (requires isAdmin)
	installExtension(pkgName: String!): ExtensionInfo! # [komika] install a store extension; NSFW-gated by show_nsfw (requires isAdmin)
	uninstallExtension(pkgName: String!): ExtensionInfo! # [komika] uninstall an extension (requires isAdmin)
	updateExtension(pkgName: String!): ExtensionInfo! # [komika] update an installed extension; NSFW-gated (requires isAdmin)
	bulkAddSourceSeries(suwayomiMangaIds: [ID!]!): BulkAddResult! # [komika] bulk Tier-2 catalogue ingest, ≤100 ids; per-id failures don't abort (requires isAdmin)
	setSeriesPaused(seriesId: ID!, paused: Boolean!): Series! # [komika] targeted pause/unpause of one series' scanning; unpause re-scans immediately (requires isAdmin)
	startSourceIngest(sourceId: ID!): SourceIngestJob! # [komika] start a background "add all from source" ingest; refused if one already running or NSFW source not opted in (requires isAdmin)
	cancelSourceIngest(jobId: ID!): SourceIngestJob! # [komika] request cancellation of a running ingest job; preserves progress (requires isAdmin)
	startExtensionIngest(pkgName: ID!): [SourceIngestJob!]! # [komika] F1: start an ingest job for EVERY installed source of an extension (e.g. MangaDex's per-language sources); skips NSFW sources for opted-out admin + sources with a job already running (returns their existing job); errors only if no source matches (requires isAdmin)
	cancelExtensionIngest(pkgName: ID!): [SourceIngestJob!]! # [komika] F1: cancel all running ingest jobs for an extension's sources; returns the cancelled jobs (requires isAdmin)
	backfillMangadexMetadata(limit: Int = 200): Int! # [komika] S2 enrichment backfill — processes up to `limit` un-enriched MangaDex-anchored works (all-language alt titles/descriptions + full credits); returns count processed; call until it returns 0 to drain (requires isAdmin)
	persistCatalogue: Int! # [komika] S1 "save everything to DB" — materialize the whole Suwayomi library (metadata + chapter lists) into the DB cache so reader loads serve from SQLite; returns series persisted; prod maintenance action gated by isAdmin (no extra flag)
	updateSeriesMetadata(input: SeriesMetadataInput!): Series! # [komika] admin series-detail editor — edit a work's title/description/type/NSFW/tags as an override layer (source data stays immutable); returns the recomputed series (requires isAdmin)
	rescanWork(workId: ID!): Int! # [komika] admin — force an immediate re-scan of EVERY installed Suwayomi source of a canonical work; returns how many sources were scanned (requires isAdmin)
	setChapterOverride(input: ChapterOverrideInput!): Boolean! # [komika] admin series-detail editor — soft-hide (reversible) or rename one chapter of a work by aggregate number; non-destructive (requires isAdmin)
}

enum ComicType {
	MANGA
	MANHWA
	MANHUA
	WEBTOON
	COMIC
}

# Maps from Suwayomi MangaStatus: UNKNOWN, ONGOING, COMPLETED, LICENSED,
# PUBLISHING_FINISHED, CANCELLED, ON_HIATUS.
enum SeriesStatus {
	ONGOING
	COMPLETED
	HIATUS
	CANCELLED
	UNKNOWN
}

type Series {
	id: ID!
	title: String!
	altTitles: [String!]!
	author: String
	artist: String
	description: String
	genres: [String!]!
	type: ComicType! # [komika] classified per source region
	status: SeriesStatus!
	coverUrl: String! # [suwayomi] thumbnailUrl (client resolves via ImageProvider)
	sourceId: String!
	chapterCount: Int!
	isMarked: Boolean! # [suwayomi] inLibrary
	libraryStatus: String # [komika] per-viewer explicit shelf (reading|completed|onhold|plan); null = auto-derive from progress
	isFavorite: Boolean! # [komika] per-viewer favourite flag
	isNsfw: Boolean! # [komika] canonical NSFW flag; false until catalogued (drives showNsfw filtering)
	rating: RatingSummary! # [komika]
	scan: ScanPolicy! # [komika] adaptive-scan config (admin-overridable)
	createdAt: String!
	updatedAt: String!
	views: SeriesViews! # [komika] per-series view (chapter-read) counts — the popularity signal; resolver field, selected only by the series-detail queries
	# [komika] S2/F2 enrichment (resolver fields — opt-in; empty for non-canonical/un-enriched works). `id` must be a canonical work id (w_…).
	localizedDescriptions: [LocalizedDescription!]! # every-language MangaDex descriptions (singular `description` stays the English-preferred primary)
	credits: [Credit!]! # full author/artist list (singular `author`/`artist` keep only the first of each)
	covers: [Cover!]! # F2: full per-volume/per-locale cover set, primary first; `coverUrl` remains the single primary. Populated by enrichment/backfill; empty until then
}

type SeriesViews {
	total: Int! # all-time views
	last7d: Int! # views in the last 7 days
	last24h: Int! # views in the last 24 hours
}

type LocalizedDescription {
	lang: String!
	description: String!
}

type Credit {
	role: String! # "author" | "artist"
	name: String!
}

type Cover {
	fileName: String! # covers/{mangadexId}/{fileName} leaf
	url: String! # proxy-ready full cover URL (client resolves via ImageProvider)
	thumbnailUrl: String! # proxy-ready 512px thumbnail URL
	lang: String # cover locale (e.g. "ja")
	volume: String # volume label (e.g. "1")
	isPrimary: Boolean! # the main cover mirrored on Series.coverUrl
}

type RatingSummary {
	average: Float!
	count: Int!
	distribution: [Int!]! # length 10; index 0 => score 1
}

type GenreFacet { # [komika] S4 search filter facet
	genre: String!
	count: Int! # cached series carrying this genre
}

type ScanPolicy {
	avgIntervalHours: Float! # rolling average between chapters
	overrideIntervalHours: Float # admin override (manga DB console)
	pollEveryMinutes: Int!
	paused: Boolean! # effective (folded) paused state
	# Raw admin overrides so the console can tell an explicit choice apart from
	# the status default even when they coincide. null => no override.
	statusOverride: SeriesStatus
	pausedOverride: Boolean
	# Raw admin poll-interval override (minutes). null => no override, so the
	# effective pollEveryMinutes above is the folded default.
	pollEveryMinutesOverride: Int
	lastScannedAt: String
	nextScanAt: String
}

type Chapter {
	id: ID!
	seriesId: ID!
	number: Float!
	title: String
	pageCount: Int!
	uploadedAt: String
	scanlator: String
	read: Boolean! # [suwayomi] isRead
	lastPageRead: Int!
	bookmarked: Boolean! # [suwayomi] isBookmarked
	isDownloaded: Boolean!
}

# Per-series read progress for the whole library, returned by `libraryProgress`
# in one batched query. read/total are counted from the cached chapter state
# (the same source `chapters(seriesId)` reads), so they match. Series with no
# cached chapters are omitted; the client treats those as unread (read = 0).
type SeriesProgress {
	id: ID! # [suwayomi] series id (matches Series.id)
	read: Int!
	total: Int!
}

# Upstream image URL; never used directly as <img src> — the client's
# ImageProvider proxies it via the Cloudflare Worker (web) or fetches it in
# Rust (native).
type Page {
	index: Int!
	sourceUrl: String!
	width: Int
	height: Int
}

enum DiscoveryFeedKind {
	POPULAR
	TRENDING
	RECENTLY_UPDATED
	RECENTLY_ADDED
	GENRE
}

type DiscoveryFeed {
	kind: DiscoveryFeedKind!
	title: String!
	genre: String
	items: [Series!]!
}

type UserRef {
	id: ID!
	username: String!
	avatarUrl: String
}

type Review {
	id: ID!
	seriesId: ID!
	author: UserRef!
	score: Int! # 1..10
	body: String!
	hasSpoiler: Boolean!
	createdAt: String!
	updatedAt: String!
}

# A comment on a polymorphic target: a chapter thread (targetType="chapter") or a
# series-level discussion (targetType="series"). Distinct from Review (scored, one/user).
type Comment {
	id: ID!
	targetType: String! # "chapter" | "series"
	targetId: ID!
	parentId: ID # [komika] reply parent; null = top-level comment (arbitrary-depth trees)
	author: UserRef!
	body: String!
	hasSpoiler: Boolean!
	mediaUrl: String # [komika] attached image path (/comment-media/<id>.webp), if any
	mediaWidth: Int # [komika] attached image dimensions (reserve layout space)
	mediaHeight: Int
	createdAt: String!
	likes: Int! # [komika] like tally
	dislikes: Int! # [komika] dislike tally
	myVote: Int! # [komika] the viewer's own vote: 1 like, -1 dislike, 0 none
}

# [komika] Result of voteComment — a comment's fresh tallies + the viewer's vote.
type CommentVote {
	likes: Int!
	dislikes: Int!
	myVote: Int!
}

# [komika] One inbound notification (the bell feed). `actor` is null for an aggregate
# like_milestone; `commentExcerpt` snippets the viewer's own comment; target* deep-links.
type Notification {
	id: ID!
	kind: String! # 'reply' | 'like_milestone'
	actor: UserRef
	commentId: ID
	commentExcerpt: String
	targetType: String
	targetId: ID
	seriesId: ID # [komika] owning series for a chapter target — deep-links to /read/<seriesId>?ch=<targetId>
	count: Int # milestone value for like_milestone
	createdAt: String!
	read: Boolean!
}

type Session {
	token: String!
	user: SessionUser!
}

type SessionUser {
	id: ID!
	username: String!
	displayName: String # [komika] editable display name; falls back to username
	bio: String # [komika] editable "about me" text
	avatarUrl: String
	isAdmin: Boolean!
	showNsfw: Boolean! # [komika] viewer's NSFW visibility preference (CATALOGUE.md §2)
	joinedAt: String! # [komika] account creation timestamp (profile "joined" date)
}

# One entry in a user's activity feed, written by the corresponding mutation.
type Activity {
	id: ID!
	kind: String! # "review" | "comment" | "library_add"
	targetType: String # "series" | "chapter"
	targetId: ID # series/chapter id acted on; the client resolves a title
	createdAt: String!
}

type SeriesPage {
	items: [Series!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

type ReviewPage {
	items: [Review!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

type CommentPage {
	items: [Comment!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

input PostReviewInput {
	seriesId: ID!
	score: Int!
	body: String!
	hasSpoiler: Boolean!
}

input PostCommentInput {
	targetType: String! # "chapter" | "series"
	targetId: ID!
	parentId: ID # [komika] reply target; must be a comment on the same target. Omit for top-level.
	body: String!
	hasSpoiler: Boolean!
	mediaId: ID # [komika] a previously-uploaded comment-media id to attach (owned + unlinked)
}

input RegisterInput {
	username: String!
	email: String!
	password: String!
}

# Editable profile fields. A null/blank field clears that value (display name
# then falls back to username).
input UpdateProfileInput {
	displayName: String
	bio: String
}

# Admin "manga DB" overrides. Whole-state: a null field clears that override, so
# the console sends the full form on save.
input SeriesAdminInput {
	seriesId: ID!
	overrideIntervalHours: Float # null => derive from avgIntervalHours
	pollEveryMinutes: Int # null => default (30)
	paused: Boolean # null => auto-pause by status
	status: SeriesStatus # null => use source status
}

# [komika] Admin edits to a canonical work's user-facing metadata (series-detail
# editor). Each optional field is three-valued: OMITTED => leave unchanged; null =>
# clear the override (use the derived/source value); a value => set the override.
input SeriesMetadataInput {
	seriesId: ID! # numeric Suwayomi id or w_ canonical id — both resolve to the work
	title: String
	description: String
	type: ComicType
	isNsfw: Boolean
	tags: [String!] # full curated tag set (whole-list replace); null clears it
}

# [komika] Raw override state of a work for the series-detail editor (parallels how
# ScanPolicy exposes its raw overrides), so the console shows pinned vs derived.
type SeriesAdminMeta {
	workId: ID # null when the series isn't catalogued yet (nothing to pin)
	titleOverride: String
	descriptionOverride: String
	contentTypeOverride: ComicType
	isNsfwOverride: Boolean
	tags: [String!]! # effective genres (curated set if any, else source-derived)
	hasCuratedTags: Boolean! # true => `tags` is an admin-curated set
}

# [komika] One chapter of a work in the admin editor: aggregate identity + override
# state (hidden / renamed).
type AdminChapter {
	number: Float!
	key: String! # aggregate bucket key (the override key)
	sourceTitle: String
	titleOverride: String
	effectiveTitle: String
	hidden: Boolean!
	sourceCount: Int! # how many sources provide this chapter number
}

# [komika] Admin edit to one chapter of a work (soft-hide / rename). Fields are
# three-valued (OMITTED => unchanged) so toggling one doesn't clobber the other.
input ChapterOverrideInput {
	workId: ID!
	chapterKey: String! # from AdminChapter.key
	hidden: Boolean
	title: String
}

# [komika] Aggregate health of the adaptive scan scheduler (admin console).
type ScanStatus {
	librarySize: Int!
	overdueCount: Int!
	lastTickAt: String
	nextDueAt: String
}

# [komika] A user account as shown in the admin user-management console.
type AdminUser {
	id: ID!
	username: String!
	email: String!
	avatarUrl: String
	isAdmin: Boolean!
	isBanned: Boolean!
	createdAt: String!
}

type AdminUserPage {
	items: [AdminUser!]!
	page: Int!
	hasNextPage: Boolean!
	total: Int
}

# [komika] Outcome of the Tier-2 dedup matcher (CATALOGUE.md §4).
# `decision` is one of `auto_merge` | `review` | `new`.
type MatchResult {
	decision: String!
	workId: String!
	matchedWorkId: String
	score: Float
	method: String
	sourceSeriesId: String!
}

# [komika] One row of the canonical updates feed (CATALOGUE.md §6): a mirrored
# MangaDex work + its latest stored chapter, served from the `chapter` mirror. Open
# it via canonicalSeries(workId) — `workId` is the `w_`-prefixed canonical reader id.
type CanonicalUpdate {
	workId: String!
	mangadexId: String!
	title: String
	isNsfw: Boolean!
	coverUrl: String # proxy-ready MangaDex cover thumbnail (null until the cover is synced)
	latestChapter: String # latest stored chapter number (string; e.g. "10.5")
	latestChapterTitle: String
	latestAt: String # publish time of the latest chapter (falls back to ingest time)
}

# [komika] One source mapping for a canonical work: which source (and, for
# Suwayomi, which extension) a native client uses to fetch it, plus source-local
# coordinates. The dedup model (CATALOGUE.md §2) may map several to one work.
type WorkSource {
	sourceType: String! # "mangadex" | "suwayomi"
	sourceId: String! # Suwayomi source id
	sourceKey: String! # manga id/slug within the source
	sourceUrl: String
	isNsfw: Boolean!
	lang: String
	extension: SourceExtension # null for mangadex-native fetch
}

# [komika] Extension coordinates for a Suwayomi-backed source: where to get the
# APK and which package/version a native client loads. Null on a mangadex-native
# WorkSource.
type SourceExtension {
	pkgName: String!
	repoUrl: String!
	apkName: String
	versionCode: Int
	lang: String
}

# [komika] All source mappings resolved for one canonical work (batch grouping).
type WorkSourceGroup {
	workId: ID!
	sources: [WorkSource!]!
}

# [komika] One source/extension that carries a canonical work — a "translator" in
# the reader UI. For a suwayomi translator, suwayomiMangaId is the id to pass to
# chapters(seriesId:) for THIS translator's chapters; for the mangadex canonical
# spine it is null and chapters come from canonicalChapters(workId).
type Translator {
	sourceType: String! # "mangadex" (canonical spine) | "suwayomi" (an installed extension)
	sourceId: String!
	sourceName: String # display name; null when the source isn't currently installed
	lang: String
	suwayomiMangaId: ID # chapters(seriesId:) key; null for the mangadex spine
	extensionPkgName: String
	extensionIconUrl: String # browser-reachable store-hosted PNG
}

# [komika] One consolidated federated-search hit: a canonical work as a Series,
# plus the per-source translator list gathered across every installed extension.
type FederatedSeries {
	series: Series!
	translators: [Translator!]!
}

# [komika] A page of federated multi-extension search results.
type FederatedSearchPage {
	items: [FederatedSeries!]!
	page: Int!
	hasNextPage: Boolean!
	sourcesQueried: Int! # how many installed sources were queried in the fan-out
}

# [komika] Admin catalogue provenance for one Suwayomi series: the canonical work
# it's linked to (null when uncatalogued) and that work's source mappings.
type SeriesSourceGroup {
	seriesId: ID!
	workId: ID
	sources: [WorkSource!]!
}

# [komika] One Keiyoushi/Mihon extension as known to the Suwayomi engine (admin
# management view, installed or not).
type ExtensionInfo {
	pkgName: String!
	name: String!
	lang: String!
	versionName: String!
	isInstalled: Boolean!
	hasUpdate: Boolean!
	isNsfw: Boolean!
	iconUrl: String
	repo: String
}

# [komika] One installed Suwayomi source — the admin picker feeding sourceBrowse.
type SourceInfo {
	id: ID!
	name: String!
	lang: String!
	isNsfw: Boolean!
	iconUrl: String
	pkgName: String
}

# [komika] Which listing of a source to browse.
enum SourceBrowseType {
	POPULAR
	LATEST
	SEARCH
}

# [komika] One manga returned by browsing a source; suwayomiMangaId is exactly
# what bulkAddSourceSeries consumes.
type SourceBrowseEntry {
	suwayomiMangaId: ID!
	title: String!
	thumbnailUrl: String
	inLibrary: Boolean!
}

# [komika] A page of source-browse results.
type SourceBrowsePage {
	items: [SourceBrowseEntry!]!
	page: Int!
	hasNextPage: Boolean!
}

# [komika] Per-id outcome of bulkAddSourceSeries: MatchResult on success, or the
# error that made this one id fail (other ids still proceed).
type BulkAddEntry {
	suwayomiMangaId: ID!
	result: MatchResult
	error: String
}

# [komika] A background "add all from this source" ingest job (S1): walks a
# source's listing page by page through the Tier-2 dedup add flow, persisting
# progress counters. Poll sourceIngestJobs(active:true) for updates.
type SourceIngestJob {
	id: ID!
	sourceId: String!
	state: String! # running | completed | cancelled | failed
	pagesDone: Int!
	itemsSeen: Int!
	succeeded: Int!
	failed: Int!
	newWorks: Int!
	autoMerged: Int!
	queuedForReview: Int!
	alreadyExisting: Int!
	error: String # set when state = failed
	startedAt: String!
	finishedAt: String # set once terminal (completed/cancelled/failed)
}

# [komika] Result of a bulk catalogue ingest: per-id entries + decision summary.
type BulkAddResult {
	entries: [BulkAddEntry!]!
	total: Int!
	succeeded: Int!
	failed: Int!
	newWorks: Int!
	autoMerged: Int!
	queuedForReview: Int!
	alreadyExisting: Int!
}

# [komika] A pending mid-confidence match awaiting manual admin review.
type MergeCandidate {
	id: String!
	sourceSeriesId: String!
	candidateWorkId: String!
	candidateTitle: String
	sourceTitle: String
	score: Float!
	method: String!
	status: String!
	createdAt: String!
}

type MergeWorksResult {
	targetWorkId: ID! # the surviving (target) work
	movedSourceSeries: Int! # how many source_series mappings re-pointed onto the target
}

# [komika] S2 cross-source chapter aggregation. `Series.chapterCount` on a canonical
# work now reflects the AGGREGATE (distinct chapter numbers across all sources), so a
# work whose MangaDex spine has 0 chapters but whose asurascans source has 201 reports 201.
type AggregatedChapter {
	number: Float!
	title: String
	sources: [ChapterSource!]! # every source (translator) that provides this chapter number
}

type ChapterSource {
	sourceType: String! # "mangadex" | "suwayomi"
	sourceId: String!
	suwayomiMangaId: ID # for a Suwayomi source: pass to chapters(seriesId:) to read this source's copy; null for the MangaDex mirror
	chapterId: ID! # the specific chapter to open (a Suwayomi chapter id, or a MangaDex chapter uuid)
	scanlator: String
}
